# KioskMate image: keep the journal in RAM so the SD card is not written
# constantly. Logs are lost on reboot. To keep them, set PERSISTENT_LOGS=yes in
# /boot/firmware/kioskmate.txt before the first boot, or delete this file and
# run: sudo systemctl restart systemd-journald
[Journal]
Storage=volatile
RuntimeMaxUse=48M
RuntimeKeepFree=64M
