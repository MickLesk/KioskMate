name: Release

on:
  push:
    tags:
      - "v0*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum

      - name: Verify release
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          for file in internal/admin/web/assets/*.js; do node --check "$file"; done
          node scripts/check-i18n.mjs
          bash -n scripts/*.sh

      - name: Verify responsive Admin UI
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.63.0
          npx playwright install --with-deps chromium
          npx playwright test --config scripts/playwright.config.mjs

      - name: Verify benchmark evidence
        run: |
          go run ./scripts/e2e-server -port 33339 >/tmp/kioskmate-e2e.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:33339/healthz >/dev/null && break
            sleep 1
          done
          HEALTH_URL=http://127.0.0.1:33339/healthz OUT=/tmp/kioskmate-benchmark.csv REPORT=/tmp/kioskmate-benchmark.json INTERVAL=1 bash scripts/benchmark.sh 2
          test "$(wc -l < /tmp/kioskmate-benchmark.csv)" -gt 1
          jq -e '.schema_version == 1 and .csv_rows > 0 and .csv_sha256 != "" and .final_health.soak.status == "collecting"' /tmp/kioskmate-benchmark.json

      - name: Build deb packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/package-deb.py --version "$VERSION" --arch arm64 --arch amd64
          bash scripts/verify-deb.sh "dist/kioskmate_${VERSION}_arm64.deb"
          bash scripts/verify-deb.sh "dist/kioskmate_${VERSION}_amd64.deb"
          python3 scripts/package-deb.py --version 0.0.0-smoke --arch amd64
          bash scripts/test-deb-lifecycle.sh "dist/kioskmate_0.0.0-smoke_amd64.deb" "dist/kioskmate_${VERSION}_amd64.deb"
          rm -f dist/kioskmate_0.0.0-smoke_amd64.deb dist/kioskmate_0.0.0-smoke_amd64.spdx.json
          (cd dist && sha256sum *.deb > SHA256SUMS)

      - name: Prepare release notes
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            $0 == "## " version { found=1 }
            found && /^## / && $0 != "## " version { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *alpha*|*beta*|*rc*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "KioskMate ${GITHUB_REF_NAME#v}" \
            --notes-file /tmp/release-notes.md \
            $PRERELEASE \
            dist/*.deb dist/*.spdx.json dist/SHA256SUMS
